name: independent-cuda-build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - run: apt-get update && apt-get install -y git g++ python3-pip && pip3 install cmake==3.28.4
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guild-inference/Guild
          ref: 4b4ded0
          path: sdk-source
      - run: cmake -S sdk-source/sdk -B sdk-build -DCMAKE_INSTALL_PREFIX=/opt/guild-sdk && cmake --install sdk-build
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/guild-sdk -DCMAKE_CUDA_ARCHITECTURES=61 && cmake --build build -j2
      - run: cmake --install build --prefix "$PWD/build/package"
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-sm61-unsigned-staging
          path: build/package/
          include-hidden-files: true
